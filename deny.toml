# cargo-deny configuration (SEC-05).

# Only the platforms qget ships binaries for (Linux).
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained but is a compile-time proc macro reached only via
    # iroh -> netwatch -> netlink-packet-core; no runtime code. Revisit when
    # iroh's netlink dependency drops it.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro via iroh netlink; no runtime exposure" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
