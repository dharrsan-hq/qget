name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: ""
            suffix: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            features: "--features p2p"
            suffix: "-p2p"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            features: ""
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: contains(matrix.target, 'linux')
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then BUILD=cross; else BUILD=cargo; fi
          $BUILD build --release --locked -p qget-cli --target ${{ matrix.target }} ${{ matrix.features }}
          name=qget-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.suffix }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/qget README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
