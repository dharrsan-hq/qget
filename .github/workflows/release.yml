name: Release

# Push a tag like v0.1.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            features: ""
          - name: linux-x86_64-p2p
            os: ubuntu-latest
            features: "--features p2p"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            features: ""
          - name: macos-aarch64
            os: macos-latest
            features: ""
          - name: macos-x86_64
            os: macos-latest
            features: ""
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          target_flag=""
          [ -n "${{ matrix.target }}" ] && target_flag="--target ${{ matrix.target }}"
          cargo build --release --locked -p qget-cli ${{ matrix.features }} $target_flag
          bin=target/${{ matrix.target }}/release/qget
          [ -f "$bin" ] || bin=target/release/qget
          mkdir -p out && cp "$bin" out/qget
          # Man page and completions come from a binary that runs on this runner.
          gen=out/qget
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p qget-cli ${{ matrix.features }}
            gen=target/release/qget
          fi
          $gen --version
          $gen man > out/qget.1
          $gen completions bash > out/qget.bash
          $gen completions zsh > out/_qget
          $gen completions fish > out/qget.fish
          file out/qget || true
      - name: Package
        shell: bash
        run: |
          dir=qget-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p $dir
          cp out/qget out/qget.1 out/qget.bash out/_qget out/qget.fish README.md LICENSE $dir/
          tar -czf $dir.tar.gz $dir
          shasum -a 256 $dir.tar.gz > $dir.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: qget-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            qget-*.tar.gz
            qget-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Combined checksums
        run: cat qget-*.tar.gz.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          notes=docs/release-notes/${GITHUB_REF_NAME}.md
          if [[ ! -f $notes ]]; then
            echo "::error::missing $notes"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: qget ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          # Tags like v0.1.0-alpha.1, or any 0.x release, are marked pre-release.
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          files: |
            qget-*.tar.gz
            qget-*.tar.gz.sha256
            SHA256SUMS
