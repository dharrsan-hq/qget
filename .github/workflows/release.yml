name: Release

# Push a tag like v0.3.0 to:
#   build → distro-test → publish (GitHub release)
#   → repositories (sign packages, build apt/dnf/pacman repos + site; needs the
#     `release` environment with PACKAGE_SIGNING_KEY / PACKAGE_SIGNING_PASSPHRASE)
#   → deploy-site (qget.dharrsan.com) → repo-test (install from the live site).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

# One site deploy at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.48.0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          # Every release binary includes peer-to-peer (yeet/yoink/mailbox).
          # Linux builds use Ubuntu 22.04 (glibc 2.35) so packages run on
          # Debian 12+, Ubuntu 22.04+, Fedora 36+ and Arch.
          - name: linux-x86_64
            os: ubuntu-22.04
            deb_arch: amd64
            nfpm_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            deb_arch: arm64
            nfpm_arch: arm64
          - name: macos-aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          target_flag=""
          [ -n "${{ matrix.target }}" ] && target_flag="--target ${{ matrix.target }}"
          cargo build --release --locked -p qget-cli --features p2p $target_flag
          bin=target/${{ matrix.target }}/release/qget
          [ -f "$bin" ] || bin=target/release/qget
          mkdir -p out && cp "$bin" out/qget
          # Man page and completions come from a binary that runs on this runner.
          gen=out/qget
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p qget-cli --features p2p
            gen=target/release/qget
          fi
          $gen --version
          $gen man > out/qget.1
          $gen completions bash > out/qget.bash
          $gen completions zsh > out/_qget
          $gen completions fish > out/qget.fish
      - name: Archive
        shell: bash
        run: |
          dir=qget-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir -p $dir
          cp out/qget out/qget.1 out/qget.bash out/_qget out/qget.fish README.md LICENSE $dir/
          tar -czf $dir.tar.gz $dir
          shasum -a 256 $dir.tar.gz > $dir.tar.gz.sha256
      - name: Linux packages (.deb, .rpm, .pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz" | tar xz nfpm
          mkdir -p dist
          cp out/qget out/qget.bash out/_qget out/qget.fish README.md LICENSE dist/
          gzip -9n -c out/qget.1 > dist/qget.1.gz
          export QGET_VERSION="${GITHUB_REF_NAME#v}" QGET_ARCH="${{ matrix.deb_arch }}"
          mkdir -p pkgs
          for p in deb rpm archlinux; do ./nfpm package -f packaging/nfpm.yaml -p $p -t pkgs/; done
          cd pkgs
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -l
          mv * ..
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            qget-*.tar.gz
            qget*.deb
            qget*.rpm
            qget*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            qget-*.tar.gz
            qget*.deb
            qget*.rpm
            qget*.pkg.tar.zst
            *.sha256

  distro-test:
    # Install each package on real distro images and use it (HTTPS download,
    # verified stream-extract), then uninstall. See packaging/test/distro-smoke.sh.
    needs: build
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:22.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:24.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "fedora:latest", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "archlinux:latest", kind: arch, arch: x86_64, runner: ubuntu-latest }
          - { image: "debian:12", kind: deb, arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: "fedora:latest", kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: art
      - name: Install, use, remove
        run: |
          ls -l art/.
          docker run --rm -v "$PWD/art/.:/pkgs:ro" -v "$PWD/packaging/test:/t:ro" \
            ${{ matrix.image }} sh /t/distro-smoke.sh ${{ matrix.kind }}

  publish:
    needs: [build, distro-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Combined checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          notes=docs/release-notes/${GITHUB_REF_NAME}.md
          if [[ ! -f $notes ]]; then
            echo "::error::missing $notes"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: qget ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          # Only tags like v0.3.0-rc.1 are pre-releases; others become "Latest",
          # which the releases/latest/download/install.sh URL relies on.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            qget-*.tar.gz
            qget*.deb
            qget*.rpm
            qget*.pkg.tar.zst
            *.sha256
            SHA256SUMS
            install.sh

  repositories:
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    env:
      # Pinned: CI refuses to sign with any other key.
      SIGNING_KEY: A03F3628DC0F7B4A2E9AE313AB43FFC72673B3AA
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Import signing key
        env:
          KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::PACKAGE_SIGNING_KEY and PACKAGE_SIGNING_PASSPHRASE must be set in the 'release' environment"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --import 2>&1 | grep -v "^gpg: key" || true
          gpg --batch --list-secret-keys --with-colons | grep -q "^fpr:::::::::$SIGNING_KEY:" \
            || { echo "::error::the secret key is not $SIGNING_KEY"; exit 1; }
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/pass" && chmod 600 "$RUNNER_TEMP/pass"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGNING_PASSPHRASE_FILE=$RUNNER_TEMP/pass" >> "$GITHUB_ENV"
          # Prove the passphrase works before building anything.
          echo test | gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" -u "$SIGNING_KEY" --clearsign >/dev/null
      - name: Collect packages (this release and the two before it)
        run: |
          mkdir -p pkgs
          for tag in $(gh release list --exclude-drafts --limit 10 --json tagName -q '.[].tagName' | head -n 3); do
            gh release download "$tag" -D pkgs -p 'qget_*.deb' -p 'qget-*.rpm' -p 'qget-*.pkg.tar.zst' --skip-existing 2>/dev/null \
              || echo "no packages in $tag"
          done
          ls -l pkgs
          ls pkgs | grep -q "qget_${GITHUB_REF_NAME#v}-" || { echo "::error::packages for $GITHUB_REF_NAME missing"; exit 1; }
      - name: Build signed repositories
        run: packaging/repo/build-repos.sh pkgs _site https://qget.dharrsan.com
      - name: Build site
        run: |
          scripts/build-site.sh "${GITHUB_REF_NAME#v}" _site
          echo "qget.dharrsan.com" > _site/CNAME
          find _site -maxdepth 3 | sort | head -50
          du -sh _site
      - name: Remove key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/pass"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-site:
    needs: repositories
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  repo-test:
    # Install from the live site exactly as the website instructs.
    needs: deploy-site
    name: repo ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:22.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:24.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "fedora:latest", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "archlinux:latest", kind: arch, arch: x86_64, runner: ubuntu-latest }
          - { image: "debian:12", kind: deb, arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: "fedora:latest", kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the new version to be served
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsSL https://qget.dharrsan.com/apt/dists/stable/main/binary-amd64/Packages | grep -q "^Version: $v-" && exit 0
            sleep 10
          done
          echo "::error::qget.dharrsan.com does not serve $v after 5 minutes"; exit 1
      - name: Add repo, install, use, remove
        run: |
          docker run --rm -v "$PWD/packaging/test:/t:ro" -e BASE=https://qget.dharrsan.com \
            ${{ matrix.image }} sh /t/repo-smoke.sh ${{ matrix.kind }}
