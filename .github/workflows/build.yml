name: Build binaries

# Builds qget on every push to main (and on demand) and uploads the binaries
# as workflow artifacts. Tagged releases are handled by release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            features: ""
          - name: linux-x86_64-p2p
            os: ubuntu-latest
            features: "--features p2p"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        run: cargo build --release --locked -p qget-cli ${{ matrix.features }}
      - name: Smoke test
        run: |
          ./target/release/qget --version
          ./target/release/qget man > qget.1
          ./target/release/qget completions bash > qget.bash
          ./target/release/qget completions zsh > _qget
          ./target/release/qget completions fish > qget.fish
      - name: Package
        shell: bash
        run: |
          dir=qget-${{ matrix.name }}
          mkdir -p $dir
          cp target/release/qget qget.1 qget.bash _qget qget.fish README.md LICENSE $dir/
          tar -czf $dir.tar.gz $dir
          sha256sum $dir.tar.gz > $dir.tar.gz.sha256
          ls -l target/release/qget
      - uses: actions/upload-artifact@v4
        with:
          name: qget-${{ matrix.name }}
          path: |
            qget-${{ matrix.name }}.tar.gz
            qget-${{ matrix.name }}.tar.gz.sha256
          retention-days: 30
