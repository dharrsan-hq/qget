name: Build binaries

# Builds qget on every push to main (and on demand) and uploads the binaries
# as workflow artifacts. Tagged releases are handled by release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every release binary includes peer-to-peer (yeet/yoink/mailbox).
          - name: linux-x86_64
            os: ubuntu-latest
            features: "--features p2p"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            features: "--features p2p"
          - name: macos-aarch64
            os: macos-latest
            features: "--features p2p"
          - name: macos-x86_64
            os: macos-latest
            features: "--features p2p"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: |
          target_flag=""
          [ -n "${{ matrix.target }}" ] && target_flag="--target ${{ matrix.target }}"
          cargo build --release --locked -p qget-cli ${{ matrix.features }} $target_flag
          bin=target/${{ matrix.target }}/release/qget
          [ -f "$bin" ] || bin=target/release/qget
          mkdir -p out && cp "$bin" out/qget
          # Man page and completions come from a binary that runs on this runner.
          gen=out/qget
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p qget-cli ${{ matrix.features }}
            gen=target/release/qget
          fi
          $gen --version
          $gen man > out/qget.1
          $gen completions bash > out/qget.bash
          $gen completions zsh > out/_qget
          $gen completions fish > out/qget.fish
          file out/qget || true
      - name: Package
        shell: bash
        run: |
          dir=qget-${{ matrix.name }}
          mkdir -p $dir
          cp out/qget out/qget.1 out/qget.bash out/_qget out/qget.fish README.md LICENSE $dir/
          tar -czf $dir.tar.gz $dir
          shasum -a 256 $dir.tar.gz > $dir.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qget-${{ matrix.name }}
          path: |
            qget-${{ matrix.name }}.tar.gz
            qget-${{ matrix.name }}.tar.gz.sha256
          retention-days: 30
