name: Build binaries

# Builds qget on every push to main (and on demand) and uploads the binaries
# as workflow artifacts. Tagged releases are handled by release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.48.0"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every release binary includes peer-to-peer (yeet/yoink/mailbox).
          - name: linux-x86_64
            os: ubuntu-22.04
            features: "--features p2p"
            deb_arch: amd64
            nfpm_arch: x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            features: "--features p2p"
            deb_arch: arm64
            nfpm_arch: arm64
          - name: macos-aarch64
            os: macos-latest
            features: "--features p2p"
          - name: macos-x86_64
            os: macos-latest
            features: "--features p2p"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Include the runner image: a target/ dir built on a newer glibc has
          # build scripts that cannot run on an older one.
          key: ${{ matrix.name }}-${{ matrix.os }}
      - name: Build
        shell: bash
        run: |
          target_flag=""
          [ -n "${{ matrix.target }}" ] && target_flag="--target ${{ matrix.target }}"
          if ! cargo build --release --locked -p qget-cli ${{ matrix.features }} $target_flag 2> build.log; then
            grep -E "^(error|warning: build failed)|GLIBC|cannot find|failed to run custom build" -A3 build.log | head -40 \
              | while IFS= read -r l; do echo "::error title=build::${l//%/%25}"; done
            tail -50 build.log
            exit 1
          fi
          bin=target/${{ matrix.target }}/release/qget
          [ -f "$bin" ] || bin=target/release/qget
          mkdir -p out && cp "$bin" out/qget
          # Man page and completions come from a binary that runs on this runner.
          gen=out/qget
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked -p qget-cli ${{ matrix.features }}
            gen=target/release/qget
          fi
          $gen --version
          $gen man > out/qget.1
          $gen completions bash > out/qget.bash
          $gen completions zsh > out/_qget
          $gen completions fish > out/qget.fish
          file out/qget || true
      - name: Package
        shell: bash
        run: |
          dir=qget-${{ matrix.name }}
          mkdir -p $dir
          cp out/qget out/qget.1 out/qget.bash out/_qget out/qget.fish README.md LICENSE $dir/
          tar -czf $dir.tar.gz $dir
          shasum -a 256 $dir.tar.gz > $dir.tar.gz.sha256
      - name: Linux packages (.deb, .rpm, .pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz" | tar xz nfpm
          mkdir -p dist pkgs
          cp out/qget out/qget.bash out/_qget out/qget.fish README.md LICENSE dist/
          gzip -9n -c out/qget.1 > dist/qget.1.gz
          export QGET_VERSION="$(out/qget --version | cut -d' ' -f2)" QGET_ARCH="${{ matrix.deb_arch }}"
          for p in deb rpm archlinux; do ./nfpm package -f packaging/nfpm.yaml -p $p -t pkgs/; done
          ls -l pkgs
      - uses: actions/upload-artifact@v4
        with:
          name: qget-${{ matrix.name }}
          path: |
            qget-${{ matrix.name }}.tar.gz
            qget-${{ matrix.name }}.tar.gz.sha256
            pkgs/*
          retention-days: 30

  distro-test:
    # Install each package on real distro images and use it (HTTPS download,
    # verified stream-extract), then uninstall. See packaging/test/distro-smoke.sh.
    needs: build
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:22.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "ubuntu:24.04", kind: deb, arch: x86_64, runner: ubuntu-latest }
          - { image: "fedora:latest", kind: rpm, arch: x86_64, runner: ubuntu-latest }
          - { image: "archlinux:latest", kind: arch, arch: x86_64, runner: ubuntu-latest }
          - { image: "debian:12", kind: deb, arch: aarch64, runner: ubuntu-24.04-arm }
          - { image: "fedora:latest", kind: rpm, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: qget-linux-${{ matrix.arch }}
          path: art
      - name: Install, use, remove
        run: |
          ls -l art/pkgs
          docker run --rm -v "$PWD/art/pkgs:/pkgs:ro" -v "$PWD/packaging/test:/t:ro" \
            ${{ matrix.image }} sh /t/distro-smoke.sh ${{ matrix.kind }}
