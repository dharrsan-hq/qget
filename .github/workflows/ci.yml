name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly deep simulation and crash sweeps.
    - cron: "17 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features qget-cli/p2p
      - run: scripts/check-deps.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y lz4 zstd
      - name: Tests (default features)
        run: cargo test --workspace
      - name: Tests (with P2P)
        run: cargo test --workspace --features qget-cli/p2p
      - name: Seed sweep (1,000 seeds per PR)
        run: QGET_SIM_SEEDS=1000 cargo test --release -p qget-core seed_sweep

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic simulation, 100k seeds (§14.3)
        run: QGET_SIM_SEEDS=100000 cargo test --release -p qget-core seed_sweep
      - name: kill -9 crash/resume, 200 rounds (DUR-06)
        run: QGET_CRASH_ROUNDS=200 cargo test --release -p qget-cli --test cli sigkill
